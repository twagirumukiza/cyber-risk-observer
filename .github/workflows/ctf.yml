name: CTF — mise à jour

# Met à jour data/ctf-veille.json : prochaines compétitions, classement mondial et derniers
# writeups (CTFtime.org, blogs spécialisés, recherche web). Se lance :
#  - chaque jour à 05 h 20 (heure de Paris en hiver) ;
#  - à la main (Actions > « CTF — mise à jour » > Run workflow) ;
#  - depuis l'éditeur (onglet CTF > « Mettre à jour depuis internet »).

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctf
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rechercher les informations
        run: python collecte/ctf.py
      - name: Enregistrer
        run: |
          git config user.name "ctf-bot"
          git config user.email "ctf-bot@users.noreply.github.com"
          git add data/ctf-veille.json
          git diff --staged --quiet || (git commit -m "CTF : mise à jour automatique" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
