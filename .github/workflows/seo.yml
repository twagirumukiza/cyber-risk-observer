name: Pages statiques (référencement)

# Génère une vraie page par article, par rubrique, le lexique, sitemap.xml et robots.txt
# à partir de data/items.json. Se lance :
#  - à chaque publication depuis l'éditeur (modification de data/items.json) ;
#  - chaque jour à 05 h 10 (heure de Paris en hiver) pour faire paraître les articles programmés ;
#  - à la main (Actions > « Pages statiques (référencement) » > Run workflow).

on:
  push:
    paths:
      - "data/items.json"
      - "data/acteurs.json"
      - "collecte/generer.py"
      - "index.html"
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer les pages
        run: python collecte/generer.py
      - name: Enregistrer les pages générées
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Pages statiques : mise à jour" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
