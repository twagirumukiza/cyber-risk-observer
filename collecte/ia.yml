name: IA — test des fournisseurs

# Teste chaque fournisseur d'IA dont la clé existe (secret du dépôt) et liste ses modèles :
# résultat dans data/ia-etat.json (clés présentes oui/non, tests, modèles ; AUCUNE valeur de clé).
# Se lance à la main ou depuis l'éditeur (onglet IA > « Tester les fournisseurs »).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester les fournisseurs
        env:
          TOUS_SECRETS: ${{ toJSON(secrets) }}
        run: python collecte/ia.py test
      - name: Enregistrer
        run: |
          git config user.name "ia-bot"
          git config user.email "ia-bot@users.noreply.github.com"
          git add data/ia-etat.json
          git diff --staged --quiet || (git commit -m "IA : état des fournisseurs" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
